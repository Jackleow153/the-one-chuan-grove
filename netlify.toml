# Static site: no build step. Netlify publishes this folder as-is.
[build]
  publish = "."
  command = ""

# Internal working files (CLAUDE.md, seo-backlog.md, data-sources.md, ops/) must never be served.
# The site publishes this folder as-is, so they return the 404 page with a real 404.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/claude.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/seo-backlog.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data-sources.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ops/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/ops"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "https://www.the-one-chuan-grove.sg/*"
  to = "https://the-one-chuan-grove.sg/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
